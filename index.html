<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科內訂便當</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee; --card:#fff; --ink:#2b2622; --muted:#7a716a; --line:#e6dfd6;
  --brand:#c2562e; --brand-soft:#fbe9e1;
  --ok:#2f7d4f; --ok-soft:#e3f2e8; --warn:#a76a00; --warn-soft:#fdf1d8;
  --bad:#b3261e; --bad-soft:#fbe4e2; --info:#2c5f9e; --info-soft:#e3edf9;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
a{color:var(--brand)}
.demo{background:#2b2622;color:#fff;font-size:12px;padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.demo button{font:inherit;border:1px solid #6b625b;background:transparent;color:#fff;border-radius:999px;padding:4px 10px;cursor:pointer}
.demo .sp{flex:1}
header{background:var(--brand);color:#fff;padding:16px}
header h1{margin:0;font-size:19px}
.sub{font-size:13px;opacity:.92;margin-top:4px;white-space:pre-line}
main{max-width:640px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:14px 0 6px;color:var(--muted);font-weight:500}
.step{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;margin-right:6px;vertical-align:1px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=time],input[type=password],textarea,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
input:disabled{background:#f3f0ec;color:var(--muted)}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
label.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;cursor:pointer}
label.chk input{width:18px;height:18px;accent-color:var(--brand)}
.req{color:var(--bad)}
.btn{font:inherit;font-weight:500;border:none;border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--brand);color:#fff}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.full{width:100%}
.btn.big{padding:14px 18px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.menu-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.menu-item:last-of-type{border-bottom:none}
.qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer;color:var(--brand)}
.qty button:disabled{opacity:.3}
.qty span{min-width:20px;text-align:center;font-weight:700}
.picker{background:#faf8f5;border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.line{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--brand-soft);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.total{font-size:22px;font-weight:700;color:var(--brand)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;font:inherit;padding:10px;border:none;background:#fff;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff;font-weight:500}
.note-preview{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--info-soft);color:var(--info);font-weight:500}
.hint{margin-top:6px;font-size:13px;color:var(--warn)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;font-weight:500}
.t-bad{background:var(--bad-soft);color:var(--bad)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-info{background:var(--info-soft);color:var(--info)} .t-ok{background:var(--ok-soft);color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.num{text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px} .stat small{color:var(--muted);font-size:12px}
.copybox{white-space:pre-wrap;word-break:break-all;background:#faf8f5;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;margin:8px 0}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:var(--muted)}
.drop img{max-width:100%;max-height:220px;border-radius:8px;display:block;margin:0 auto 8px}
.edit-row{display:grid;grid-template-columns:1fr 84px 36px;gap:6px;margin-bottom:6px}
.x{border:none;background:var(--bad-soft);color:var(--bad);border-radius:8px;cursor:pointer;font-size:16px;min-width:32px;min-height:32px}
.person{padding:10px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:none}
.items{font-size:13px;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.big-emoji{font-size:44px}
.sticky{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);margin:12px -14px -14px;padding:12px 14px;border-radius:0 0 14px 14px;z-index:2}
.foot{text-align:center;font-size:13px;margin-top:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2622;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="demoBar" class="demo hidden">
  <b>示範模式</b><span>資料只存在這台裝置，尚未連接 Google 試算表</span><span class="sp"></span>
  <button data-demo="order">點餐頁</button><button data-demo="admin">負責人後台</button>
  <button data-demo="next">⏭ 模擬隔天</button><button data-demo="clear">清除資料</button>
</div>
<header><h1 id="hTitle">🍱 訂便當</h1><div class="sub" id="hSub"></div></header>
<main id="main"><div class="empty">載入中…</div></main>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
 * 設定：把 Apps Script 部署後的「網頁應用程式網址」貼在這裡
 * 留空 = 示範模式（資料只存在自己的瀏覽器，方便先試用）
 * ========================================================= */
const API_URL = "";

const SUGAR = ["正常糖","少糖","半糖","微糖","無糖"];
const ICE = ["正常冰","少冰","微冰","去冰","溫","熱"];
const DEMO = !API_URL;

// ---------- 小工具 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Number(n || 0).toLocaleString();
const pad = n => String(n).padStart(2, "0");
const hm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function fmtDate(s){ if(!s) return ""; const [y,m,d] = s.split("-").map(Number); const dt = new Date(y, m-1, d); return `${m}/${d}（${"日一二三四五六"[dt.getDay()]}）`; }
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("已複製，可以貼到 LINE"); }catch(e){ toast("無法自動複製，請長按文字手動複製"); } }
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
function setMain(h){ $("#main").innerHTML = h; }
function setHeader(t, s){ $("#hTitle").textContent = t; $("#hSub").textContent = s || ""; }
function defaultDeadline(type){
  const d = new Date(Date.now() + (type === "drink" ? 3 : 2) * 3600000);
  let h = d.getHours(), m = d.getMinutes() < 30 ? 30 : 0; if(m === 0) h++;
  if(h > 23){ h = 23; m = 30; }
  return pad(h) + ":" + pad(m);
}
function linesText(items){ return items.map(l => l.name + (l.opts ? "（" + l.opts + "）" : "") + (l.qty > 1 ? " ×" + l.qty : "")).join("、"); }

const ERR = {
  network:"連線失敗，請檢查網路後再試", need_pass:"需要通關密碼", wrong_admin_pass:"負責人密碼錯誤",
  admin_pass_not_set:"後端還沒設定 ADMIN_PASS", no_session:"今天還沒開放點餐", need_name:"請輸入名字",
  no_items:"請至少選一樣餐點", bad_last5:"請輸入 5 位數的帳號後五碼", need_with:"請輸入與誰確認繳款",
  bad_method:"請選擇付款方式", exists:"今天已經建立過點餐頁了", no_menu:"請至少有一個品項",
  missing_fields:"請填寫負責人和收款帳號", no_ai_key:"還沒設定 AI 金鑰，請手動輸入品項",
  ai_error:"AI 辨識失敗，請換一張清楚的照片再試", ai_parse:"AI 回傳格式有誤，請再試一次", not_found:"找不到這筆資料", title_exists:"今天已經有同名的團了，請換一個團名"
};
function errMsg(e){ if(!e) return "發生錯誤"; if(String(e).startsWith("closed:")) return `「${e.slice(7)}」已經截止點餐`; return ERR[e] || ("發生錯誤：" + e); }

// ---------- API ----------
async function api(action, data = {}){
  const body = { action, pass: LS.get("bento_pass", ""), adminPass: LS.get("bento_admin", ""), ...data };
  try{
    if(DEMO) return await Mock.handle(body);
    const r = await fetch(API_URL, { method:"POST", body: JSON.stringify(body) }); // text/plain，避免 CORS 預檢
    return await r.json();
  }catch(e){ return { ok:false, error:"network" }; }
}

function menuPrompt(kind){
  const drink = kind === "drink";
  return `你會看到一張台灣${drink ? "飲料店" : "便當店／餐廳"}的菜單照片。請辨識所有可點的品項和價格。
規則：
- 品名用繁體中文，照菜單上的寫法
${drink ? "- 同一飲料有不同杯型價格（中杯/大杯、M/L）時，拆成不同品項，例如「珍珠奶茶（大）」" : "- 同一品項有不同尺寸或價格（大/小、飯/麵）時，拆成不同品項，例如「排骨飯（大）」\n- 加點類（加蛋、加飯、飲料、湯）也要列出"}
- 看不清楚的價格填 0
- 若能看出店名和電話也一起回傳
只回傳 JSON：{"store":"店名或空字串","phone":"電話或空字串","items":[{"name":"品名","price":90}]}`;
}

// ---------- 示範模式的假後端（邏輯與 Code.gs 相同，資料存在瀏覽器） ----------
const Mock = {
  db:null,
  load(){ if(!this.db) this.db = LS.get("bento_demo2", null) || { offset:0, groups:[], orders:[], stores:[] }; return this.db; },
  save(){ LS.set("bento_demo2", this.db); },
  today(){ const d = new Date(Date.now() + this.load().offset * 86400000); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; },
  async handle(r){ const res = await this.route(r, this.load(), this.today()); this.save(); return JSON.parse(JSON.stringify(res)); },
  async route(r, db, d){
    const groups = () => db.groups.filter(g => g.date === d);
    const orders = () => db.orders.filter(o => o.date === d);
    switch(r.action){
      case "checkAdmin": return r.adminPass ? { ok:true } : { ok:false, error:"wrong_admin_pass" };
      case "getToday": return { ok:true, date:d, now:hm(new Date()), groups:groups().map(g => ({ ...g, names:orders().filter(o => o.gid === g.gid).map(o => o.name) })) };
      case "getOrders": return r.adminPass ? { ok:true, date:d, now:hm(new Date()), groups:groups().map(g => ({ ...g, orders:orders().filter(o => o.gid === g.gid) })) } : { ok:false, error:"wrong_admin_pass" };
      case "listStores": return { ok:true, stores:db.stores };
      case "createSession": {
        const duty = String(r.duty||"").trim(), bank = String(r.bank||"").trim();
        if(!duty || !bank) return { ok:false, error:"missing_fields" };
        const title = String(r.title||"").trim() || duty + "團";
        if(groups().some(g => g.title === title)) return { ok:false, error:"title_exists" };
        const stores = (r.stores || []).map((st, i) => ({
          id:(st.type === "drink" ? "drink" : "store") + i, type:st.type === "drink" ? "drink" : "bento",
          name:String(st.name||"").trim() || (st.type === "drink" ? "飲料" : "便當"), phone:String(st.phone||"").trim(),
          deadline:st.deadline || "", options:!!st.options,
          menu:(st.menu||[]).filter(m => String(m.name||"").trim()).map((m, j) => ({ id:j+1, name:String(m.name).trim(), price:Number(m.price)||0 }))
        })).filter(st => st.menu.length);
        if(!stores.length) return { ok:false, error:"no_menu" };
        const gid = Math.random().toString(36).slice(2, 8);
        db.groups.push({ gid, title, date:d, duty, bank, stores });
        stores.forEach(st => { db.stores = db.stores.filter(x => x.name !== st.name); db.stores.push({ name:st.name, type:st.type, phone:st.phone, options:st.options, menu:st.menu.map(m => ({ name:m.name, price:m.price })) }); });
        return { ok:true, gid };
      }
      case "deleteSession": db.groups = db.groups.filter(g => !(g.date === d && g.gid === r.gid)); return { ok:true };
      case "submitOrder": {
        const s = groups().find(g => g.gid === r.gid); if(!s) return { ok:false, error:"no_session" };
        const name = String(r.name||"").trim(); if(!name) return { ok:false, error:"need_name" };
        const now = hm(new Date()), items = []; let amount = 0;
        for(const it of r.items || []){
          const st = s.stores.find(x => x.id === it.storeId); const m = st && st.menu.find(x => String(x.id) === String(it.itemId));
          if(!m) continue;
          if(st.deadline && now > st.deadline) return { ok:false, error:"closed:" + st.name };
          const qty = Math.max(1, parseInt(it.qty) || 1); amount += m.price * qty;
          items.push({ storeId:st.id, itemId:m.id, name:m.name, price:m.price, qty, opts:it.opts || "" });
        }
        if(!items.length) return { ok:false, error:"no_items" };
        const p = r.pay || {}; let pay;
        if(p.method === "transfer"){ if(!/^\d{5}$/.test(p.last5||"")) return { ok:false, error:"bad_last5" }; pay = { method:"transfer", last5:p.last5, with:"", note:"匯款，帳號後五碼 " + p.last5, confirmed:false }; }
        else if(p.method === "cash"){ const w = String(p.with||"").trim(); if(!w) return { ok:false, error:"need_with" }; pay = { method:"cash", last5:"", with:w, note:`已與${w}確認繳款${amount}元`, confirmed:false }; }
        else return { ok:false, error:"bad_method" };
        const same = o => o.date === d && o.gid === s.gid && o.name === name;
        if(db.orders.some(same) && !r.replace) return { ok:false, error:"duplicate" };
        db.orders = db.orders.filter(o => !same(o));
        const order = { date:d, gid:s.gid, id:Math.random().toString(36).slice(2,10), name, items, amount, note:String(r.note||""), pay };
        db.orders.push(order); return { ok:true, order };
      }
      case "setConfirmed": { const o = db.orders.find(x => x.id === r.id); if(!o) return { ok:false, error:"not_found" }; o.pay.confirmed = !!r.confirmed; return { ok:true }; }
      case "deleteOrder": db.orders = db.orders.filter(x => x.id !== r.id); return { ok:true };
      case "updateDeadline": { const s = groups().find(g => g.gid === r.gid); const st = s && s.stores.find(x => x.id === r.storeId); if(st) st.deadline = r.deadline || ""; return { ok:true }; }
      case "recognizeMenu": return await this.recognize(r);
    }
    return { ok:false, error:"unknown_action" };
  },
  async recognize(r){
    // 在 claude.ai 預覽時可以用 Claude 辨識；放到 GitHub 後由 Apps Script 呼叫 Gemini
    try{
      if(window.claude && claude.use){
        const s = await claude.use("sample");
        if(s){
          const bin = atob(r.image), arr = new Uint8Array(bin.length);
          for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          const data = await s.json(menuPrompt(r.kind), { images:[new Blob([arr], { type:r.mime })] });
          if(!data || !Array.isArray(data.items)) return { ok:false, error:"ai_parse" };
          return { ok:true, store:data.store || "", phone:data.phone || "", items:data.items.map(i => ({ name:String(i.name||"").trim(), price:Number(i.price)||0 })).filter(i => i.name) };
        }
      }
    }catch(e){ return { ok:false, error:"ai_error" }; }
    return { ok:false, error:"no_ai_key" };
  }
};

// =========================================================
// 點餐頁
// =========================================================
const O = { data:null, form:null, picking:null, dup:false, done:null, editing:false, busy:false };
const hashGid = () => location.hash.startsWith("#g-") ? location.hash.slice(3) : null;
function curGroup(){
  const gs = (O.data && O.data.groups) || [], hg = hashGid();
  if(hg) return gs.find(g => g.gid === hg) || null;
  return gs.length === 1 ? gs[0] : null;
}
const storesLine = g => g.stores.map(st => `${st.type === "drink" ? "🧋" : "🍱"} ${st.name}${st.deadline ? `（${st.deadline} 截止）` : ""}`).join("　");
function newForm(keepName){
  return { name: keepName ? LS.get("bento_name", "") : "", qty:{}, lines:[], note:"",
    method: LS.get("bento_method", "transfer"), last5: LS.get("bento_last5", ""), with:"" };
}
async function loadOrder(){
  const r = await api("getToday");
  O.data = r; if(!O.form) O.form = newForm(true);
  render();
}
const isClosed = st => !!st.deadline && hm(new Date()) > st.deadline;
function formItems(){
  const s = curGroup(), out = [];
  for(const [k, q] of Object.entries(O.form.qty)){
    if(!q) continue; const [sid, iid] = k.split("|");
    const st = s.stores.find(x => x.id === sid), m = st && st.menu.find(x => String(x.id) === iid);
    if(m) out.push({ storeId:sid, itemId:m.id, name:m.name, price:m.price, qty:q, opts:"" });
  }
  O.form.lines.forEach(l => {
    const st = s.stores.find(x => x.id === l.storeId), m = st && st.menu.find(x => String(x.id) === String(l.itemId));
    if(m) out.push({ storeId:l.storeId, itemId:m.id, name:m.name, price:m.price, qty:1, opts:l.opts });
  });
  return out;
}
const sum = items => items.reduce((a, l) => a + l.price * l.qty, 0);

function renderOrder(){
  const r = O.data;
  if(!r){ setHeader("🍱 訂便當"); return setMain(`<div class="empty"><span class="spin"></span>載入中…</div>`); }
  if(!r.ok){
    setHeader("🍱 訂便當");
    if(r.error === "need_pass") return setMain(`<div class="card"><h2>請輸入科內通關密碼</h2>
      <input type="password" id="passIn" placeholder="通關密碼"><button class="btn full" style="margin-top:10px" data-act="savePass">進入</button>

async function submitOrder(replace){
  const f = O.form, items = formItems(), name = f.name.trim();
  if(!name){ toast("請先輸入名字"); const el = $("#fName"); el.focus(); el.scrollIntoView({ block:"center" }); return; }
  if(!items.length) return toast("請至少選一樣餐點");
  if(f.method === "transfer" && !/^\d{5}$/.test(f.last5)){ toast("請輸入 5 位數的帳號後五碼"); $("#fLast5").focus(); return; }
  if(f.method === "cash" && !f.with.trim()){ toast("請輸入與誰確認繳款"); $("#fWith").focus(); return; }
  if(!replace && !O.editing && curGroup().names.includes(name)){ O.dup = true; keepScroll(render); return; }
  O.busy = true; O.dup = false; keepScroll(render);
  const g = curGroup();
  const r = await api("submitOrder", { gid:g.gid, name, items:items.map(l => ({ storeId:l.storeId, itemId:l.itemId, qty:l.qty, opts:l.opts })), note:f.note.trim(),
    pay:{ method:f.method, last5:f.last5, with:f.with.trim() }, replace: !!replace || O.editing });
  O.busy = false;
  if(r.ok){
    LS.set("bento_name", name); LS.set("bento_method", f.method); if(f.last5) LS.set("bento_last5", f.last5);
    O.done = { ...r.order, note:f.note.trim() }; O.editing = false;
    if(!g.names.includes(name)) g.names.push(name);
    render(); window.scrollTo(0, 0);
  }else if(r.error === "duplicate"){ O.dup = true; keepScroll(render); }
  else { toast(errMsg(r.error)); keepScroll(render); }
}

const A = { authed:false, data:null, loginErr:"", draft:null, stores:null, confirmDel:null, editDl:null, busy:false, loadedAt:null, gid:null, creating:false };
const adminGroup = () => A.data && A.data.groups && A.data.groups.find(g => g.gid === A.gid) || null;
function newStore(type){ return { type, name:"", phone:"", deadline:defaultDeadline(type), options:type === "drink", menu:[], photo:"", busy:false, msg:"" }; }
function newDraft(){ return { title:LS.get("bento_title", ""), duty:LS.get("bento_duty", ""), bank:LS.get("bento_bank", ""), stores:[newStore("bento")] }; }

async function loadAdmin(silent){
  if(!LS.get("bento_admin", "")){ A.authed = false; return render(); }
  const r = await api("getOrders");
  if(!r.ok && (r.error === "wrong_admin_pass" || r.error === "admin_pass_not_set")){ A.authed = false; A.loginErr = errMsg(r.error); LS.del("bento_admin"); return render(); }
  A.authed = true; A.data = r; A.loadedAt = new Date();
  if(r.ok){
    const mine = LS.get("bento_mygroup", null);   // 這台裝置今天開的團，登入後直接打開
    if(!A.gid && mine && mine.date === r.date && r.groups.some(g => g.gid === mine.gid)) A.gid = mine.gid;
    if(A.gid && !r.groups.some(g => g.gid === A.gid)) A.gid = null;
  }
  if(r.ok && (A.creating || !r.groups.length) && !A.stores){ const s = await api("listStores"); A.stores = s.ok ? s.stores : []; }
  silent ? keepScroll(render) : render();
}

function renderResults(s){
  const d = A.data, orders = s.orders || [];
  const url = location.href.split("#")[0] + "#g-" + s.gid;
  setHeader(`🧾 ${s.title}`, `${fmtDate(d.date)}・負責人：${s.duty}`);
  const shareText = `🍱 ${fmtDate(d.date)} ${s.title} 訂便當\n${s.stores.map(st => `${st.type === "drink" ? "🧋" : "🍱"} ${st.name}${st.deadline ? `（${st.deadline} 截止）` : ""}`).join("\n")}\n\n點餐連結👇\n${url}\n\n負責人：${s.duty}`;
  const grand = orders.reduce((a, o) => a + o.amount, 0);
  const pending = orders.filter(o => !o.pay.confirmed);

  let h = d.groups.length > 1 ? `<p style="margin:0 0 10px"><a href="#" data-act="backList">← 今天所有團（${d.groups.length}）</a></p>` : "";
  h += `<div class="card"><h2>📣 貼到 LINE 群組</h2><div class="copybox">${esc(shareText)}</div><button class="btn sm" data-act="copy" data-text="${esc(shareText)}">複製公告</button></div>`;
  h += `<div class="stats"><div class="stat"><b>${orders.length}</b><small>人點餐</small></div><div class="stat"><b>${money(grand)}</b><small>總金額</small></div>
    <div class="stat"><b style="color:var(--warn)">${pending.length}</b><small>筆待確認</small></div></div>`;

  s.stores.forEach(st => {
    const agg = {}; let subtotal = 0; const notes = [];
    orders.forEach(o => {
      const mine = o.items.filter(l => l.storeId === st.id);
      mine.forEach(l => { const k = l.name + (l.opts ? "（" + l.opts + "）" : ""); agg[k] = agg[k] || { qty:0, amt:0 }; agg[k].qty += l.qty; agg[k].amt += l.qty * l.price; subtotal += l.qty * l.price; });
      if(mine.length && o.note && st.type !== "drink") notes.push(`${o.name}：${o.note}`);
    });
    const keys = Object.keys(agg).sort();
    const cnt = keys.reduce((a, k) => a + agg[k].qty, 0);
    const callText = `${st.name} 您好，我要訂${st.type === "drink" ? "飲料" : "便當"}：\n${keys.map(k => `${k} ×${agg[k].qty}`).join("\n")}${notes.length ? "\n\n備註：\n" + notes.map(n => "・" + n.replace(/^[^：]+：/, "")).join("\n") : ""}\n\n共 ${cnt} 份，${money(subtotal)}`;
    h += `<div class="card"><div class="row between"><h2 style="margin:0">${st.type === "drink" ? "🧋" : "📞"} ${esc(st.name)}</h2>`;
    if(A.editDl === st.id) h += `<span class="row"><input type="time" id="dlIn" value="${esc(st.deadline)}" style="width:120px"><button class="btn sm" data-act="saveDl" data-s="${st.id}">儲存</button><button class="btn ghost sm" data-act="cancelDl">取消</button></span>`;
    else h += `<span class="row"><span class="muted">${st.deadline ? (isClosed(st) ? "已截止 " : "截止 ") + esc(st.deadline) : "不限時間"}</span><button class="btn ghost sm" data-act="editDl" data-s="${st.id}">修改</button></span>`;
    h += `</div>`;
    if(!keys.length) h += `<p class="muted">還沒有人點。</p>`;
    else{
      h += `<table style="margin-top:8px"><tr><th>品項</th><th class="num">數量</th><th class="num">小計</th></tr>
        ${keys.map(k => `<tr><td>${esc(k)}</td><td class="num"><b>${agg[k].qty}</b></td><td class="num">${money(agg[k].amt)}</td></tr>`).join("")}
        <tr><td><b>合計 ${cnt} 份</b></td><td></td><td class="num"><b>${money(subtotal)}</b></td></tr></table>
        ${notes.length ? `<h3>備註</h3><div class="muted">${notes.map(esc).join("<br>")}</div>` : ""}
        <div class="row wrap" style="margin-top:12px"><button class="btn sm" data-act="copy" data-text="${esc(callText)}">複製訂餐文字</button>${st.phone ? `<span class="muted">電話：<a href="tel:${esc(st.phone)}">${esc(st.phone)}</a></span>` : ""}</div>`;
    }
    h += `</div>`;
  });

  // 收款總覽
  const tr = orders.filter(o => o.pay.method === "transfer"), cash = orders.filter(o => o.pay.method === "cash");
  const byWith = {}; cash.forEach(o => { (byWith[o.pay.with] = byWith[o.pay.with] || []).push(o); });
  h += `<div class="card"><h2>💰 收款總覽</h2><table>
    <tr><td>🏦 匯款</td><td class="num">${tr.length} 人</td><td class="num">${money(tr.reduce((a, o) => a + o.amount, 0))}</td><td class="num muted">已對帳 ${tr.filter(o => o.pay.confirmed).length}/${tr.length}</td></tr>
    ${Object.keys(byWith).map(w => `<tr><td>💵 與${esc(w)}確認</td><td class="num">${byWith[w].length} 人</td><td class="num">${money(byWith[w].reduce((a, o) => a + o.amount, 0))}</td><td class="num muted">${byWith[w].map(o => esc(o.name)).join("、")}</td></tr>`).join("")}
    </table></div>`;

  h += `<div class="card"><div class="row between"><h2 style="margin:0">🧾 每個人的訂單</h2><button class="btn ghost sm" data-act="refresh">重新整理</button></div>`;
  if(!orders.length) h += `<p class="muted">還沒有人點餐。</p>`;
  [...orders].sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name)).forEach(o => {
    const p = o.pay;
    const tag = p.confirmed ? { cls:"t-ok", label:p.method === "cash" ? "現金・已點收" : "匯款・已對帳" }
      : p.method === "transfer" ? { cls:"t-warn", label:`匯款待對帳（後五碼 ${p.last5}）` } : { cls:"t-info", label:p.note };
    h += `<div class="person"><div class="row between"><b>${esc(o.name)}</b><b>${money(o.amount)}</b></div>
      <div class="items">${esc(linesText(o.items))}${o.note ? "｜" + esc(o.note) : ""}</div>
      <div class="row between wrap" style="margin-top:6px"><span class="tag ${tag.cls}">${esc(tag.label)}</span><span class="row">
      ${p.confirmed ? `<button class="btn ghost sm" data-act="conf" data-id="${o.id}" data-v="0">取消確認</button>` : `<button class="btn sm" data-act="conf" data-id="${o.id}" data-v="1">${p.method === "transfer" ? "已對帳" : "已點收"}</button>`}
      ${A.confirmDel === o.id ? `<button class="btn danger sm" data-act="delOrder" data-id="${o.id}">確定刪除</button>` : `<button class="x" data-act="askDel" data-id="${o.id}" title="刪除">×</button>`}
      </span></div></div>`;
  });
  h += `<p class="muted" style="margin:10px 0 0">匯款：對照網銀的後五碼和金額後按「已對帳」。現金：大家已備註與誰確認，清點繳款盒時再按「已點收」。</p></div>`;

  const pt = tr.filter(o => !o.pay.confirmed);
  if(pt.length){
    const t = `【便當匯款提醒】\n以下同仁的匯款還沒對到帳，麻煩確認一下🙏\n${pt.map(o => `・${o.name} ${money(o.amount)}`).join("\n")}\n\n帳號：${s.bank.replace(/\n/g, " ")}`;
    h += `<div class="card"><h2>🔔 匯款提醒</h2><div class="copybox">${esc(t)}</div><button class="btn sm" data-act="copy" data-text="${esc(t)}">複製提醒，貼到 LINE</button></div>`;
  }
  h += `<p class="muted" style="text-align:center">每 30 秒自動更新・上次更新 ${A.loadedAt ? hm(A.loadedAt) : ""}</p>
    <div class="card"><h3 style="margin-top:0">進階</h3><p class="muted" style="margin:0 0 8px">菜單或店家設定錯了，可以刪除這團重新建立（已點的訂單會保留在試算表裡）。</p>
    ${A.confirmDel === "session" ? `<button class="btn danger sm" data-act="delSession">確定刪除這團</button> <button class="btn ghost sm" data-act="cancelDel">取消</button>` : `<button class="btn ghost sm" data-act="askDel" data-id="session">刪除這團</button>`}</div>
    <p class="foot">${d.groups.length > 1 ? `<a href="#" data-act="backList">今天所有團</a>　·　` : `<a href="#" data-act="newGroup">＋ 開新團</a>　·　`}<a href="#">← 回點餐頁</a>　·　<a href="#" data-act="logout">登出</a></p>`;
  setMain(h);
}
const rank = o => o.pay.confirmed ? 3 : o.pay.method === "transfer" ? 1 : 2;

async function shrinkToDataURL(file){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85);
}

// =========================================================
// 事件（委派）
// =========================================================
const ACT = {
  reload(){ route() === "admin" ? (A.data = null, render(), loadAdmin()) : (O.data = null, render(), loadOrder()); },
  savePass(){ LS.set("bento_pass", $("#passIn").value.trim()); O.data = null; render(); loadOrder(); },
  inc(t){ O.form.qty[t.dataset.k] = (O.form.qty[t.dataset.k] || 0) + 1; keepScroll(render); },
  dec(t){ const k = t.dataset.k; if(O.form.qty[k]) O.form.qty[k]--; if(!O.form.qty[k]) delete O.form.qty[k]; keepScroll(render); },
  pick(t){ O.picking = { storeId:t.dataset.s, itemId:t.dataset.i, sugar:"", ice:"" }; keepScroll(render); },
  sugar(t){ O.picking.sugar = t.dataset.v; keepScroll(render); },
  ice(t){ O.picking.ice = t.dataset.v; keepScroll(render); },
  addLine(){ const p = O.picking; O.form.lines.push({ storeId:p.storeId, itemId:p.itemId, opts:`${p.sugar}・${p.ice}` }); O.picking = null; toast("已加入"); keepScroll(render); },
  cancelPick(){ O.picking = null; keepScroll(render); },
  rmLine(t){ O.form.lines.splice(+t.dataset.idx, 1); keepScroll(render); },
  method(t){ O.form.method = t.dataset.v; keepScroll(render); },
  submit(){ submitOrder(false); },
  submitReplace(){ submitOrder(true); },
  cancelDup(){ O.dup = false; keepScroll(render); },
  editMine(){
    const o = O.done, f = newForm(false); f.name = o.name; f.note = o.note || ""; f.method = o.pay.method; f.last5 = o.pay.last5 || ""; f.with = o.pay.with || "";
    o.items.forEach(l => { const st = curGroup().stores.find(x => x.id === l.storeId);
      if(st && st.options) for(let i = 0; i < l.qty; i++) f.lines.push({ storeId:l.storeId, itemId:l.itemId, opts:l.opts });
      else f.qty[l.storeId + "|" + l.itemId] = (f.qty[l.storeId + "|" + l.itemId] || 0) + l.qty; });
    O.form = f; O.done = null; O.editing = true; render();
  },
  chooseGroup(t){ O.form.qty = {}; O.form.lines = []; O.picking = null; O.done = null; O.dup = false; O.editing = false; location.hash = "g-" + t.dataset.g; },
  switchGroup(){ O.form.qty = {}; O.form.lines = []; O.picking = null; O.done = null; O.dup = false; O.editing = false; location.hash = ""; },
  another(){ O.form = newForm(false); O.done = null; O.editing = false; render(); setTimeout(() => $("#fName") && $("#fName").focus()); },

  async adminLogin(){ const v = $("#adminIn").value.trim(); if(!v) return toast("請輸入密碼"); LS.set("bento_admin", v); A.loginErr = ""; A.data = null; render(); await loadAdmin(); },
  logout(t, e){ e.preventDefault(); LS.del("bento_admin"); A.authed = false; A.data = null; A.gid = null; A.creating = false; render(); },
  addDrink(){ A.draft.stores.push(newStore("drink")); keepScroll(render); },
  rmStore(t){ A.draft.stores.splice(+t.dataset.idx, 1); keepScroll(render); },
  addItem(t){ const st = A.draft.stores[+t.dataset.idx]; st.menu.push({ name:"", price:0 }); keepScroll(render);
    const ins = document.querySelectorAll(`[data-in="mn"][data-idx="${t.dataset.idx}"]`); ins[ins.length - 1].focus(); },
  rmItem(t){ A.draft.stores[+t.dataset.idx].menu.splice(+t.dataset.j, 1); keepScroll(render); },
  async recog(t){
    const st = A.draft.stores[+t.dataset.idx]; if(!st.photo || st.busy) return;
    st.busy = true; st.msg = ""; keepScroll(render);
    const r = await api("recognizeMenu", { image:st.photo.split(",")[1], mime:"image/jpeg", kind:st.type });
    st.busy = false;
    if(r.ok && r.items.length){ st.menu = r.items; if(!st.name && r.store) st.name = r.store; if(!st.phone && r.phone) st.phone = r.phone; st.msg = `辨識出 ${r.items.length} 個品項，請檢查品名和價格是否正確。`; }
    else st.msg = r.ok ? "沒有辨識到品項，請換一張清楚一點的照片，或手動新增。" : errMsg(r.error);
    keepScroll(render);
  },
  async create(){
    const d = A.draft;
    if(!d.duty.trim()) return toast("請填寫你的名字");
    if(!d.bank.trim()) return toast("請填寫收款帳號");
    for(const st of d.stores){
      if(!st.name.trim()) return toast(`請填寫${st.type === "drink" ? "飲料" : "便當"}店名`);
      if(!st.menu.some(m => m.name.trim())) return toast(`${st.name} 還沒有品項`);
      if(st.menu.some(m => m.name.trim() && !(Number(m.price) > 0))) return toast(`${st.name} 有品項價格是 0，請確認`);
    }
    A.busy = true; keepScroll(render);
    const r = await api("createSession", { title:d.title.trim(), duty:d.duty.trim(), bank:d.bank.trim(), stores:d.stores.map(st => ({ type:st.type, name:st.name, phone:st.phone, deadline:st.deadline, options:st.options, menu:st.menu })) });
    A.busy = false;
    if(r.ok){
      LS.set("bento_duty", d.duty.trim()); LS.set("bento_bank", d.bank.trim()); LS.set("bento_title", d.title.trim());
      LS.set("bento_mygroup", { date:A.data.date, gid:r.gid });
      A.draft = null; A.stores = null; A.creating = false; A.gid = r.gid; toast("點餐頁已產生！把公告貼到 LINE 群組吧"); A.data = null; render(); loadAdmin();
    }
    else { toast(errMsg(r.error)); keepScroll(render); }
  },
  copy(t){ copy(t.dataset.text); },
  editDl(t){ A.editDl = t.dataset.s; keepScroll(render); },
  cancelDl(){ A.editDl = null; keepScroll(render); },
  async saveDl(t){ const v = $("#dlIn").value; const r = await api("updateDeadline", { gid:A.gid, storeId:t.dataset.s, deadline:v }); A.editDl = null; if(!r.ok) toast(errMsg(r.error)); else toast("已更新截止時間"); loadAdmin(true); },
  async conf(t){ const o = adminGroup().orders.find(x => x.id === t.dataset.id); const v = t.dataset.v === "1"; if(o) o.pay.confirmed = v; keepScroll(render);
    const r = await api("setConfirmed", { id:t.dataset.id, confirmed:v }); if(!r.ok){ toast(errMsg(r.error)); loadAdmin(true); } },
  askDel(t){ A.confirmDel = t.dataset.id; keepScroll(render); },
  cancelDel(){ A.confirmDel = null; keepScroll(render); },
  async delOrder(t){ A.confirmDel = null; const r = await api("deleteOrder", { id:t.dataset.id }); toast(r.ok ? "已刪除" : errMsg(r.error)); loadAdmin(true); },
  async delSession(){ A.confirmDel = null; const r = await api("deleteSession", { gid:A.gid }); toast(r.ok ? "已刪除這團" : errMsg(r.error)); A.gid = null; A.data = null; A.stores = null; render(); loadAdmin(); },
  openGroup(t){ A.gid = t.dataset.g; render(); window.scrollTo(0, 0); },
  backList(){ A.gid = null; A.editDl = null; A.confirmDel = null; render(); window.scrollTo(0, 0); },
  newGroup(){ A.creating = true; A.draft = null; A.gid = null; A.data && (A.stores = null); render(); window.scrollTo(0, 0); loadAdmin(); },
  cancelCreate(){ A.creating = false; A.draft = null; render(); window.scrollTo(0, 0); },
  refresh(){ loadAdmin(true).then(() => toast("已更新")); }
};
const IN = {
  name(t){ O.form.name = t.value; O.dup = false; const h = $("#nameHint"); if(h) h.innerHTML = nameHintText(); },
  note(t){ O.form.note = t.value; },
  last5(t){ t.value = t.value.replace(/\D/g, ""); O.form.last5 = t.value; },
  with(t){ O.form.with = t.value; const p = $("#prev"); if(p) p.textContent = `已與${t.value.trim() || "＿＿"}確認繳款${sum(formItems())}元`; },
  st(t){ A.draft.stores[+t.dataset.idx][t.dataset.k] = t.value; },
  mn(t){ A.draft.stores[+t.dataset.idx].menu[+t.dataset.j].name = t.value; },
  mp(t){ A.draft.stores[+t.dataset.idx].menu[+t.dataset.j].price = Number(t.value) || 0; },
  duty(t){ A.draft.duty = t.value; },
  title(t){ A.draft.title = t.value; },
  bank(t){ A.draft.bank = t.value; }
};
const CH = {
  async photo(t){ const f = t.files[0]; if(!f) return; const st = A.draft.stores[+t.dataset.idx];
    try{ st.photo = await shrinkToDataURL(f); st.msg = "照片已選好，按「辨識菜單」。"; }catch(e){ st.msg = "讀不到這張照片，請換一張"; } keepScroll(render); },
  opt(t){ A.draft.stores[+t.dataset.idx].options = t.checked; },
  pickSaved(t){ const st = A.draft.stores[+t.dataset.idx]; if(t.value === ""){ return; }
    const saved = (A.stores || []).filter(x => (x.type || "bento") === st.type)[+t.value];
    if(saved){ st.name = saved.name; st.phone = saved.phone || ""; st.options = !!saved.options; st.menu = saved.menu.map(m => ({ ...m })); st.msg = `已載入「${saved.name}」的菜單，價格有變的話可以直接改。`; }
    keepScroll(render); }
};
const main = $("#main");
main.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if(!t || t.disabled) return; const fn = ACT[t.dataset.act]; if(fn){ if(t.tagName === "A") e.preventDefault(); fn(t, e); } });
main.addEventListener("input", e => { const t = e.target; if(t.dataset.in && IN[t.dataset.in]) IN[t.dataset.in](t, e); });
main.addEventListener("change", e => { const t = e.target; if(t.dataset.ch && CH[t.dataset.ch]) CH[t.dataset.ch](t, e); });
main.addEventListener("keydown", e => { if(e.key === "Enter"){ if(e.target.id === "adminIn") ACT.adminLogin(); if(e.target.id === "passIn") ACT.savePass(); } });

// =========================================================
// 路由與啟動
// =========================================================
const route = () => location.hash === "#admin" ? "admin" : "order";
function render(){ route() === "admin" ? renderAdmin() : renderOrder(); }
function start(){ window.scrollTo(0, 0); render(); route() === "admin" ? loadAdmin() : loadOrder(); }
window.addEventListener("hashchange", start);
setInterval(() => { if(route() === "admin" && A.authed && A.data && A.data.ok && !A.creating && !A.editDl && !A.confirmDel && !document.hidden) loadAdmin(true); }, 30000);

if(DEMO){
  $("#demoBar").classList.remove("hidden");
  $("#demoBar").addEventListener("click", e => {
    const b = e.target.closest("[data-demo]"); if(!b) return;
    const a = b.dataset.demo;
    if(a === "order"){ location.hash = ""; }
    else if(a === "admin"){ location.hash = "admin"; }
    else if(a === "next"){ Mock.load().offset++; Mock.save(); O.data = null; O.done = null; O.form = newForm(true); A.data = null; A.draft = null; A.stores = null; A.gid = null; A.creating = false; toast(`已切換到隔天：${fmtDate(Mock.today())}`); start(); }
    else if(a === "clear"){ Mock.db = { offset:0, groups:[], orders:[], stores:[] }; Mock.save(); ["bento_name","bento_last5","bento_duty","bento_bank","bento_method","bento_title","bento_mygroup"].forEach(LS.del); O.data = null; O.done = null; O.form = null; A.data = null; A.draft = null; A.stores = null; A.gid = null; A.creating = false; toast("示範資料已清除"); start(); }
  });
}
start();
